<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Ícono de ZYKRO: Z en cursiva con líneas de velocidad dentro de un hexágono de neón. -->
  <defs>
    <radialGradient id="fondo" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#3b1470"/>
      <stop offset="1" stop-color="#120a22"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="letra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2d4ff"/>
    </linearGradient>
    <filter id="brillo-hexagono" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="brillo-letra" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" in="SourceAlpha" result="b"/>
      <feFlood flood-color="#c4a5ff" flood-opacity="0.9"/>
      <feComposite in2="b" operator="in" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="60" fill="url(#fondo)"/>
  <polygon points="128,30 212,79 212,177 128,226 44,177 44,79" fill="none" stroke="url(#neon)"
           stroke-width="11" stroke-linejoin="round" filter="url(#brillo-hexagono)"/>
  <g stroke="#d8b4fe" stroke-width="9" stroke-linecap="round" opacity="0.85">
    <line x1="22" y1="106" x2="66" y2="106"/>
    <line x1="12" y1="134" x2="58" y2="134"/>
    <line x1="26" y1="162" x2="50" y2="162"/>
  </g>
  <g transform="translate(32 0) skewX(-14)" filter="url(#brillo-letra)">
    <polygon points="92,80 176,80 176,106 124,160 176,160 176,186 92,186 92,160 144,106 92,106" fill="url(#letra)"/>
  </g>
</svg>
