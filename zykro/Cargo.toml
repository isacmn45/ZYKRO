[package]
name = "zykro"
version = "0.1.0"
edition = "2021"
description = "ZYKRO: emulador propio sobre el Android de SwagPlayer (redroid + swag-rust-server)"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui-phosphor = "0.14.0"
libc = "0.2.191"
libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"
memmap2 = "0.9.11"
nix = { version = "0.31.3", features = ["socket", "poll", "uio"] }
png = "0.18.1"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
winit = { version = "0.30", default-features = false }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
